<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>My English Notebooks</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset('css/app.css') }}">
<script>
  // Values from the server that the scripts below need
  window.APP_CONFIG = {
    supabaseUrl: {{ supabase_url | tojson }},
    supabaseKey: {{ supabase_key | tojson }},
    configProblem: {{ config_problem | tojson }},
    whisperAvailable: {{ whisper_available | tojson }},
  };
</script>
<!-- Order matters: each script uses what the earlier ones define -->
<script src="{{ asset('js/core.js') }}" defer></script>
<script src="{{ asset('js/auth.js') }}" defer></script>
<script src="{{ asset('js/data.js') }}" defer></script>
<script src="{{ asset('js/dashboard.js') }}" defer></script>
<script src="{{ asset('js/notebook.js') }}" defer></script>
<script src="{{ asset('js/csv.js') }}" defer></script>
<script src="{{ asset('js/learn.js') }}" defer></script>
<script src="{{ asset('js/speech.js') }}" defer></script>
<script src="{{ asset('js/main.js') }}" defer></script>
</head>
<body>
<main>

  {% include 'partials/login.html' %}
  {% include 'partials/userbar.html' %}
  {% include 'partials/dashboard.html' %}
  {% include 'partials/notebook.html' %}
  {% include 'partials/learn.html' %}
</main>

{% include 'partials/modal.html' %}
</body>
</html>
