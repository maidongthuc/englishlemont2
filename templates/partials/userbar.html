<!-- ===== Signed-in bar ===== -->
<div class="userbar" id="userbar" hidden>
  <span class="user">
    <img id="user-avatar" alt="" width="28" height="28" referrerpolicy="no-referrer" hidden>
    <span id="user-name"></span>
    <span class="tag" id="admin-tag" hidden>Admin</span>
  </span>
  <button type="button" class="icon-btn" id="signout">Sign out</button>
</div>
