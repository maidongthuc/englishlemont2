<!-- ===== Hộp thoại xác nhận ===== -->
<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <form method="dialog">
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="modal-text" id="modal-text"></p>
    <div class="row modal-actions">
      <button type="submit" class="btn ghost" value="cancel" id="modal-cancel">Cancel</button>
      <button type="submit" class="btn danger-btn" value="ok" id="modal-ok">Delete</button>
    </div>
  </form>
</dialog>
